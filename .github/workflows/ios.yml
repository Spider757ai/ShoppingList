name: iOS build

on:
  push:
    paths:
      - 'ShoppingList/**'
      - 'ShoppingListUITests/**'
      - 'ShoppingList.xcodeproj/**'
      - '.github/workflows/ios.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build app and UI test module
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ShoppingListArtifacts"
          xcodebuild build-for-testing \
            -project ShoppingList.xcodeproj \
            -scheme ShoppingList \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ShoppingListBuild" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/ShoppingListArtifacts/build.log"

      - name: Prepare source archive
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ShoppingListArtifacts"
          git archive --format=zip HEAD -o "$RUNNER_TEMP/ShoppingListArtifacts/ShoppingList-source.zip"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shoppinglist-build
          path: ${{ runner.temp }}/ShoppingListArtifacts
          retention-days: 14
